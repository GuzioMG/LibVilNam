# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version. This is currently 2.
loaderVersion="${loader_version_range}" #mandatory

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://github.com/GuzioMG/LibVilNam/issues?q=" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://modrinth.com/mod/lvn" #optional

# A file name (in the root of the mod JAR) containing a logo for display
logoFile="logo.png" #optional

# A text field displayed in the mod UI
#credits="" #optional

# The authors of the mod, displayed in the mod UI (optional)
authors="Guzio"

# The description text for the mod (multi line!) (#mandatory)
description='''
# LibVilNam
*Welcome to [YOUR VILLAGE NAME HERE], village-chief-sama! UwU*

## What in the alphabet-soup am I looking at?
VibVilNam is a village names library (that's actually just its name, except it's written in the Linux naming convention, so everything is shortened to 3 characters max, and „Library” goes first not last - just like „C Library” becomes „LibC”), that any other mod can use to attach names to villages in a cross-compatible way.

### And what the hell does that mean?
Imagine you have one mod that places some kind of transportation markers in villages (maybe the transportation method is walking and the marker is a minimap waypoint; maybe is't a waystone mod; maybe it's a train station attached to a procedurally generated network) and another mod that welcomes you when you enter a village (maybe something like Traveller's Titles, but for villages; maybe something sign-based). Now, wouldn't it be *oh' so nice* if the mod said „Welcome to *(village X)*!” and then the transportation marker was also called „*(village X)*”? Unfortunately, this isn't possible today.

*...Unless the mod integrates with LibVilNam!* That's right! Tired of multiple mods giving conflicting village names, when running large enough modpacks? We're here to the rescue! LVN provides a library that other mod authors can hook into to make their village names consistent with all other mods that also support LibVilNam (see list below). In some cases, the mods themselves may not even have to support LVN directly, as we have an as-of-yet-short (but steadily growing) list of official integrations with popular mods, for which we maintain support inside LibVilNam itself.

Do you only have a single village-naming mod? LibVilName can be useful, too! Most name-generating mods just blindly toss together an adjective/noun and a city-like word, and form a name from them (for example, Sunnyvale, Steamtown, Icetopia, etc.). This is fine, but it quickly gets repetitive and boring. LVN uses a different technique, called a Markov Chain, which is kinda like a small LLM (well, if it's small, then that's no longer a *Large* Language Model, but you get the idea). It trains its understanding on how a given language connects its syllables in a provided dataset (see Configuring LibVilNam below on how to provide it) and then tries to extrapolate from there. (Note, that Markov Chains don't support any fancy optimization concepts like Attention, which theoretically makes them less memory-efficient than an LLM (if one was to use a Markov Chain to generate full paragraphs, they'd need exabytes of RAM), but the need very little memory *overhead* (your dataset itself kinda *is* the model - no need to load tens of GBs of model weights into a GPU), which in practice makes them far better than LLMs for generating short one-word sequences (like a village name) - thanks to this, LVN can run fully locally on your CPU, and you don't need to put any slop-API tokens anywhere in the config or have a NASA computer that makes the surrounding buildings collapse.) All this means that you get much more realistic-sounding and unique names, and you also have a lot of control over the style of generated names (just use a different training dataset), letting you fairly easily change eg. languages or even go back to those old repetitive names (if you liked them).

## Download
* [From Modrinth](https://modrinth.com/mod/lvn)
* On GitHub, please build from source or download a [release](https://github.com/GuzioMG/LibVilNam/releases/).
* CruseForge support is not planned.

