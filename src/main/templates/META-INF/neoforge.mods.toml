## Usage - For regular players
Most basic usage of LibVilNam is laughably simple. For most mods (those marked as **[AUTO]** above), all you need is to install LVN and the chosen mod, and you can enjoy shared village names between mods. Sometimes, you may need to install an extra mod (those in the 3rd-party support list above) to bridge the gap, or to change some config value to explicitly enable LVN support (if there is no **[AUTO]** marking). That's mod-specific, so it's not documented here.

For advanced use, however, see below:

### Configuring LibVilNam
LibVilNam's config file depends on your modding platform. On Forge, you'll find it at `~/.minecraft/config/lvn-common.toml` and for Fabric, it's `~/.minecraft/config/lvn.properties` (Linux client via the official Minecraft launcher for both - adjust for your OS, client/server situation, and launcher yourself). Wherever your file is, it will contain the following keys:
* `padding`: How many extra chunks in every direction should a village claim as its own territory? This is done to account for mods that spawn structures *close to* (but not *inside*) villages, like Railways Untold stations. Defaults to `3` (configurable `1`-`5`), on top of rounding-up to the nearest chunk outside of the village's bounding box (core behavior, cannot be configured).
* `do_villagelike`: Should „village-like” structures (ie. those that generally have some humanoid-ish inhabitants and don't seem like some ancient ruins, such as Woodland Mansions or Bastions) also be given names, or do we only assign names to actual villages? Will look for structures in both `#minecraft:village` and `#lvn:villagelike` tags if `true`, only for `#minecraft:village` if `false`. If you want more fine-grade control over what structures count as villages, you can edit the aforementioned tags using a datapack.
* `dataset`: The dataset on which LibVilNam trains its Markov Chain village name generator. Words are space-separated. Defaults to one that gives you Polish-sounding names, see below for defaults.
* `lang`: Dash-delimited locale code for the language in which the dataset above is written. If using a fantasy language, pick an IRL one with the closest-matching alphabet. Don't worry, it doesn't need to be a strict subset/superset of letters (even the good'ol English should be enough for most cases), just don't do anything too stupid, like a dataset in Japanese and a Greek alphabet. Defaults to `pl-PL` to match the dataset above.

### Picking a dataset
By default, LibVilNam trains its Markov Chain on [this dataset](https://github.com/GuzioMG/LibVilNam/blob/main/generator/research/stage10.csv). It's a [hand-curated](https://github.com/GuzioMG/LibVilNam/blob/main/generator/research/README.md) list **of over four thousand** various Polish geographical place-names (villages, cities, wojweództwos, gminas, and powiats - and some words may be parts of street-names, too, because of how the data was obtained). We decided to go this route, instead of training it on eg. American or British places, because:
* This mod was initially developed for [GhostLand 8](https://github.com/Team-GhostLand/GhostLand-Modpacks/tree/master/ghostland8), and GhostLand is a Polish community/modpack/SMP/Discord/I-don't-really-know-what-GhostLand-is-tbh-it's-kinda-like-modern-Xbox-branding-where-it's-everything-all-at-once, and we wanted the names to be more familiar this edition; something to differentiate it from prior editions with village names (6 and [7](https://github.com/Team-GhostLand/GhostLand-Modpacks/tree/master/ghostland7)), where all names were generically-American (see: how most name generators work, above - and coincidentally, this also seems to be how USA invents its counties). ~~We technically could've just used this dataset on GhostLand alone, but I spent too much time on making it usable and wanted to show off.~~
* We wanted to leverage this project cultural advantage to provide a *genuinely unique* experience to our users. Kinda like in The Witcher, you don't really have generic-ass goblins or slimes, that you'd find in all repetitive MMOs or Gatcha games, but rather monsters that draw inspiration from our local Polish/slavic folklore, which most players enjoy, due to a certain exploratory factor. Likewise, because of the author's familiarity with the Polish language (given how she grew up here all her life), names generated by LibVilNam can sound uniquely-Polish, which lets you explore the depths of this language and should as such be more enjoyable.

...in theory. In practice, we understand that some players may not want to deal with having to pronounce „Sokołobrychodnorostrów” (*real name produced by our generator during development). For that reason, we offer the ability to change how the generator works by using a different dataset. The exact instructions for doing that are above, here I'd like to instead focus on obtaining it. In general, you have 2 routes: either you download a database from your local government and try to massage the data yourself (unless your gov't provides more useful stuff than ours), or you head over to [SamCodes Markov](https://www.samcodes.co.uk/project/markov-namegen/), press Settings, set Length Range 3-23 + Order 3 + Prior 0.00 + Backoff 0 (that's the params used by LibVilNam), and start messing around with pre-made datasets until you find one that generates names that look like something you might want to use. If you need a starting point, we found that their „Currencies” dataset produces some interesting results, that look great as some sort of non-descript fantasy language (at least if you assume that „Mark” means city/town/village/etc. in that language, as that suffix seems somewhat common).

### In-game commands
* `/lvn-getvillage` to figure out in what village are you right now, and if in a village at all (using all 4 available strategies for locating villages)
* `/lvn-rename` to rename the village you're currently at (determined by the 1st strategy printed by the command above)

### World files
LibVilNam persists its village names between restarts in `~/.minecraft/saves/[world name]/lvn/[dimension namespace]/[dimension id].csv`. For example, for villages located in the `minecraft:overworld` dimension of the „My Forever World” world, the path will be: `~/.minecraft/saves/My Forever World/lvn/minecraft/overworld.csv`.

## Usage - For consumers
There is no developer guide or community *yet*. All I can say is use [Modrinth Maven](https://support.modrinth.com/en/articles/8801191-modrinth-maven) to add a dependency, and then [check out our public API on on GitHub](https://github.com/GuzioMG/LibVilNam/blob/main/src/main/java/hub/guzio/lvn/API.java) to figure out how to interact with it (it's really simple, I promise). An instance of the API can be obtained via `hub.guzio.lvn.internal.Main.i().getAPI()` (that's the 1st and last time one should ever interact with the `internal` package, as everything else there is highly platform- and version-dependent - meanwhile, public methods in `hub.guzio.lvn.API` (except for its constructor) and `hub.guzio.lvn.Village` are guaranteed to follow SemVer).

